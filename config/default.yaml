broker:
  http:
    host: 127.0.0.1
    port: 4180
    auth_token: ${CLAUDE_BROKER_TOKEN}
  socket:
    path: /tmp/claude-broker.sock
  defaults:
    job_ttl_sec: 300
    heartbeat_timeout_sec: 30
    sweep_interval_sec: 30
    long_poll_max_sec: 600
    client_ref_window_sec: 86400
    orphan_grace_sec: 120
  # Auto-clear: reset an idle session's context window after it finishes jobs —
  # the automated equivalent of typing `/clear` in the TUI when the queue drains,
  # so a long-lived worker session doesn't run out of context tokens. The broker
  # can't clear via the job channel (that only carries message content), so it
  # types the keys into the session's terminal externally: tmux `send-keys` (the
  # pane is auto-detected from the session pid, or set `tmux_target`), or a custom
  # `command`. Off by default — keystroke injection is environment-specific and
  # must not fire blind. Turn on with CLAUDE_BROKER_AUTO_CLEAR=1 (the session must
  # run under tmux for auto-detection, e.g. the README's tmux/`cll` launch).
  auto_clear:
    enabled: ${CLAUDE_BROKER_AUTO_CLEAR:-false}
    idle_sec: ${CLAUDE_BROKER_AUTO_CLEAR_IDLE_SEC:-180}
    min_jobs: ${CLAUDE_BROKER_AUTO_CLEAR_MIN_JOBS:-1}
    cooldown_sec: ${CLAUDE_BROKER_AUTO_CLEAR_COOLDOWN_SEC:-300}
    check_interval_sec: 30
    keys: /clear
    # Pin the pane if auto-detection can't find it (e.g. `broker:0.0` or a session name):
    tmux_target: ${CLAUDE_BROKER_AUTO_CLEAR_TMUX_TARGET:-}
    # Or fully override the injection with your own command (gets CLAUDE_BROKER_CLEAR_KEYS,
    # CLAUDE_BROKER_SESSION_ID/LABEL/PID, CLAUDE_BROKER_TMUX_TARGET in its env):
    command: ${CLAUDE_BROKER_AUTO_CLEAR_COMMAND:-}
  # TUI watcher (0.6): read what each attached session's terminal shows
  # (ready / working / usage_limited / login_required / context_wedged /
  # channels_unavailable …). Routing skips sessions that cannot work. Read-only
  # for sessions the broker does not manage.
  tui:
    enabled: ${CLAUDE_BROKER_TUI_ENABLED:-true}
    check_interval_sec: ${CLAUDE_BROKER_TUI_INTERVAL_SEC:-15}
    watch_unmanaged: ${CLAUDE_BROKER_TUI_WATCH_UNMANAGED:-true}
  # Nudge (0.6): an idle Claude TUI may not wake on a pushed job. When a job sits
  # `dispatched` longer than after_sec and the pane shows the idle prompt, type
  # `text` + Enter. On for fleet-managed sessions; opt in for your own panes.
  nudge:
    enabled: ${CLAUDE_BROKER_NUDGE_UNMANAGED:-false}
    managed: ${CLAUDE_BROKER_NUDGE_MANAGED:-true}
    after_sec: ${CLAUDE_BROKER_NUDGE_AFTER_SEC:-20}
    cooldown_sec: ${CLAUDE_BROKER_NUDGE_COOLDOWN_SEC:-60}

# Fleet (0.6): sessions the broker launches + supervises itself, in tmux windows
# on its PRIVATE tmux server (`tmux -L claude-broker`). Spec: GET/PUT /fleet
# (saved to spec_path). Sign-in: POST /auth/login (long-lived setup-token,
# saved to oauth_env, 0600). Watch: `tmux -L claude-broker attach -t claude-broker`.
fleet:
  enabled: ${CLAUDE_BROKER_FLEET_ENABLED:-true}
  tmux_socket: ${CLAUDE_BROKER_FLEET_TMUX_SOCKET:-claude-broker}
  tmux_session: ${CLAUDE_BROKER_FLEET_TMUX_SESSION:-claude-broker}
  spec_path: ${CLAUDE_BROKER_FLEET_SPEC:-}
  state_dir: ${CLAUDE_BROKER_FLEET_STATE_DIR:-}
  oauth_env: ${CLAUDE_BROKER_OAUTH_ENV:-}
  claude_bin: ${CLAUDE_BROKER_CLAUDE_BIN:-}
  shim_command: ${CLAUDE_BROKER_SHIM_COMMAND:-}
  check_interval_sec: 10

storage:
  job_store:
    driver: sqlite
    sqlite:
      path: ${HOME}/.local/state/claude-broker/jobs.sqlite

dispatch:
  driver: inproc

logging:
  level: info
  pretty: true
  # Per-session job I/O logging (the daemon's structured view: each job's
  # input content + final result/error). Disabled by default. The full Claude
  # terminal transcript is captured separately by the `cll` launcher — see the
  # README "Session logging" section.
  sessions:
    enabled: ${CLAUDE_BROKER_LOG_SESSIONS:-false}
    # dir defaults to ~/.local/state/claude-broker/logs; override with the
    # CLAUDE_BROKER_LOG_DIR env var (takes precedence everywhere).
    max_bytes: ${CLAUDE_BROKER_LOG_MAX_BYTES:-5242880}
    retain_days: ${CLAUDE_BROKER_LOG_RETAIN_DAYS:-}

instructions: |
  You have access to a "claude-broker" channel. Channel events arrive as
  <channel source="claude-broker" job_id="..." ...>...</channel> tags.

  For every channel event you receive that contains a `job_id` attribute:

    1. Read the event content. Treat it as a request from a user, even
       though it didn't come through the chat.
    2. Do the work the event describes. Use whatever tools you need.
    3. When the work is done, call the `complete_job` tool with the
       `job_id` from the original tag and your final answer as `result`.
       `result` can be a string or a structured object.
    4. If you decide the work can't be completed, call `fail_job` with
       the `job_id` and an `error` string explaining why.
    5. For long-running work where the submitter may want intermediate
       updates, call `note_progress(job_id, note)` whenever you reach a
       checkpoint. This is optional.

  Do not skip step 3 or 4. The submitter is waiting for that tool call —
  without it they get no response. Submitters can also send follow-up
  comments while you work; those arrive as the same `<channel>` tag with
  `kind="comment"` and the same `job_id`. Treat them as additions to the
  original request.

  A `<channel ... kind="cancel" job_id="...">` event means the submitter
  cancelled the job. Stop working on it; do not call complete_job.
